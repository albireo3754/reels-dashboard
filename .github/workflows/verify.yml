name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PHOTOSINDEX_SIGNING_MODE: adhoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm run verify:spec
      - run: npm test
      - run: npm run test:native
      - run: npm run build:native
      - run: npm run build
      - run: npm run test:web
      - run: npm run test:electron
      - run: npm run package:mac
      - run: npm run audit:public
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 5

name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PHOTOSINDEX_SIGNING_MODE: ci-adhoc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/audit-public.mjs --history HEAD
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run check:architecture
      - run: npm run typecheck
      - run: zsh native/photosindex/scripts/test-sign-app.zsh
      - run: npm run verify:spec
      - run: npm run test:native
      - run: npm run build:native
      - run: npm run test:native-rebuild
      - run: npm run test:native-install
      - run: brew install uv ffmpeg x264 x265 pkg-config
      - run: npm run build:editor
      # Media service tests execute the bundled FFmpeg/editor runtime.
      - run: npm test
      - run: npm run test:editor-engine
      - run: npm run build
      - run: npm run test:cli
      - run: npm run test:web
      - run: npm run test:workflow-ui
      - run: REELS_EDITOR_QA=1 npm run test:electron
      - run: npm run package:mac
      - name: Verify packaged desktop and PTY
        shell: bash
        run: |
          shopt -s nullglob
          app_binaries=(release/mac*/"Reels Dashboard.app/Contents/MacOS/Reels Dashboard")
          test "${#app_binaries[@]}" -eq 1
          test -x "${app_binaries[0]}"
          REELS_ELECTRON_EXECUTABLE="$PWD/${app_binaries[0]}" npm run test:electron -- tests/electron/desktop.spec.ts tests/electron/workbench-mode.spec.ts
      - run: npm run audit:public
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            test-results/
            artifacts/
          retention-days: 5

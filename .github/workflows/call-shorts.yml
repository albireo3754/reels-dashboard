name: Call shorts
on:
  pull_request:
    paths:
      - 'pipelines/call-shorts/**'
      - '.github/workflows/call-shorts.yml'
      - 'package*.json'
  push:
    branches: [main]
    paths:
      - 'pipelines/call-shorts/**'
      - '.github/workflows/call-shorts.yml'
      - 'package*.json'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: npm ci --ignore-scripts
      - run: npm run test:call-shorts

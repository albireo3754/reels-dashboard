# Copy into a private content workspace as workflow.yaml.
# Add the actual skill names/paths used by that workspace to each skills list.
version: 1
id: content-production
title: 자료에서 완성본까지
entry: prepare
maxTransitions: 40
steps:
  - id: prepare
    title: 자료·경험 질문 준비
    kind: task
    instruction: >-
      프로젝트의 기존 문안·촬영물·최신 사용자 정정을 확인한다.
      Dashboard에서 프로젝트와 원본을 찾아 연결하고 source-notes.md에 근거와 미확인을 기록한다.
      경험을 추정하지 말고 실제로 빠진 질문만 experience-form.json으로 준비한다.
      폼 형식은 공통 입력폼 서비스 문서를 따른다.
    skills: []
    tools:
      - {server: reels_dashboard, name: reels_list_projects, purpose: 기존 프로젝트와 연결 자료 조회}
      - {server: reels_dashboard, name: reels_get_content, purpose: 프로젝트의 최신 상태 확인}
    inputs: [brief.md]
    outputs: [source-notes.md, experience-form.json]
    completion: [관련 촬영물과 출처 확인, 확인되지 않은 경험을 질문으로 분리]
    on: {done: experience}
  - id: experience
    title: 내 경험 입력
    kind: input
    instruction: 사진과 확인된 사실을 보고 실제 경험을 입력한다. 기억나지 않음과 제외도 유효한 답변이다.
    formFile: experience-form.json
    completion: [사용자가 공통 폼에 명시적으로 응답하고 제출]
    on: {done: draft}
  - id: draft
    title: 구성·대본 작성
    kind: task
    instruction: 제출 답변 원문과 근거를 읽고 추가 요청을 처리한다. 장면 순서와 대본을 draft.md에 작성하고 판단 근거를 남긴다.
    skills: []
    inputs: [source-notes.md]
    outputs: [draft.md]
    completion: [직접 경험과 장면이 연결됨, 답변 속 추가 요청 처리 결과 기록]
    on: {done: text_review}
  - id: text_review
    title: 문안 검토
    kind: review
    instruction: 근거·사용자 답변과 대본을 비교한다. 검토 대상은 수정하지 말고 별도 보고서에 구체적인 판단을 기록한다.
    skills: []
    inputs: [draft.md]
    outputs: ['text-review-{attempt}.md']
    completion: [사실·주체·말투 검토, 수정할 항목 또는 통과 근거 기록]
    on: {pass: edit, revise: draft}
  - id: edit
    title: 편집·렌더
    kind: task
    instruction: >-
      문안과 이전 화면 검토를 읽고 편집한다. 현재 앱 상태와 최신 프로젝트 revision을 조회해 충돌을 보존한다.
      미리보기 이미지를 직접 확인하고 렌더 작업이 종료될 때까지 조회한다.
      완료 출력 경로와 실제 확인 내용을 render-report.md에 남긴다. 여러 컷 편집은 현재 지원 도구를 확인한다.
    tools:
      - {server: reels_dashboard, name: reels_get_app_state, purpose: 저장 안 된 편집과 진행 작업 확인}
      - {server: reels_dashboard, name: reels_get_project, purpose: 최신 편집 revision 조회}
      - {server: reels_dashboard, name: reels_update_project, purpose: 승인 범위의 편집 설정 변경}
      - {server: reels_dashboard, name: reels_preview_frame, purpose: 실제 프레임 미리보기}
      - {server: reels_dashboard, name: reels_start_render, purpose: 출력 작업 시작}
      - {server: reels_dashboard, name: reels_get_render_job, purpose: 출력 완료 또는 실패 확인}
    inputs: [draft.md]
    outputs: [render-report.md]
    completion: [요청한 편집 반영과 미리보기 확인, 출력 작업 완료와 경로 기록]
    on: {done: visual_review}
  - id: visual_review
    title: 실제 출력 검토
    kind: review
    instruction: render-report.md의 실제 영상·표지를 열어 요청한 부분을 검사한다. 렌더 성공을 화면 품질 통과로 대신하지 않는다.
    skills: []
    inputs: [render-report.md]
    outputs: ['visual-review-{attempt}.md']
    completion: [실제 산출물 확인, 통과 또는 수정 필요 근거 기록]
    on: {pass: deliver, revise: edit}
  - id: deliver
    title: 승인된 전달·상태 확인
    kind: task
    instruction: >-
      사용자에게 전달 권한을 받은 범위에서만 프로젝트의 고정 outbound를 사용한다.
      start 응답을 잃으면 현재 작업을 먼저 조회하고 중복 시작하지 않는다.
      실제 업로드 완료와 파일 목록을 delivery-report.md에 기록한다. 공개 발행은 사람이 수행한다.
    tools:
      - {server: reels_dashboard, name: reels_get_content, purpose: 프로젝트의 고정 outbound 확인}
      - {server: reels_dashboard, name: reels_start_icloud_delivery, purpose: 승인된 파일 전달}
      - {server: reels_dashboard, name: reels_get_icloud_delivery, purpose: 실제 업로드 완료 확인}
    inputs: [render-report.md]
    outputs: [delivery-report.md]
    completion: [전달 권한 확인, 실제 업로드 상태와 결과 파일 목록 기록]
    on: {done: $complete}
